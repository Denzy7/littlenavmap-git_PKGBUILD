name: Build littlenavmap-git (x86_64)

on:
  push:
    paths:
      - "PKGBUILD"
      - "*.patch"
      - "LittleNavmap.desktop"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "PKGBUILD"
      - "*.patch"
      - "LittleNavmap.desktop"
      - ".github/workflows/build.yml"
  workflow_dispatch:
  schedule:
    # Rebuild weekly to track the -git upstream
    - cron: "0 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Arch Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update system and install build tooling
        # Package dependencies are deliberately NOT installed here:
        # `makepkg -s` installs them, which also verifies the PKGBUILD's
        # depends/makedepends are complete.
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git sudo

      - name: Resolve upstream commit hashes
        id: srcrefs
        run: |
          set -euo pipefail
          # Read the git sources (name::git+url#branch=...) straight from the
          # PKGBUILD so branch names live in exactly one place. Query their
          # latest commits WITHOUT cloning; together they identify the source
          # state this build would produce and drive the cache key below.
          source ./PKGBUILD
          combined=""
          for s in "${source[@]}"; do
            [[ $s == *::git+* ]] || continue
            name=${s%%::*}
            url=${s#*::git+}
            branch=${url##*#branch=}
            url=${url%%#*}
            # `head -n1` guards against ls-remote matching more than one ref
            sha=$(git ls-remote "$url" "refs/heads/$branch" | head -n1 | cut -f1)
            if ! [[ $sha =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Could not resolve a single commit SHA for $name ($url $branch, got: '$sha')"
              exit 1
            fi
            echo "$name ($branch): $sha"
            combined+="${combined:+-}$sha"
          done
          echo "combined=$combined" >> "$GITHUB_OUTPUT"

      - name: Restore source/build cache
        uses: actions/cache@v6
        with:
          # sources: makepkg SRCDEST (bare git mirrors, incremental fetches)
          # src:     makepkg srcdir (working copies + fixed-name build dir,
          #          so `make` only recompiles what changed)
          path: |
            sources
            src
          # Exact hit only when neither the packaging nor anything upstream
          # changed. Otherwise fall back to the newest older cache, preferring
          # one built from the same PKGBUILD/patches.
          key: littlenavmap-v2-${{ hashFiles('PKGBUILD', '*.patch') }}-${{ steps.srcrefs.outputs.combined }}
          restore-keys: |
            littlenavmap-v2-${{ hashFiles('PKGBUILD', '*.patch') }}-
            littlenavmap-v2-

      - name: Create unprivileged build user
        run: |
          # makepkg refuses to run as root, so create a dedicated user
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p "$GITHUB_WORKSPACE/sources"
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package with makepkg
        # -s: install missing deps via pacman, --needed: skip installed deps,
        # --noconfirm: no prompts. No -c: src/ must survive for the cache.
        # The image's makepkg.conf has `debug` in OPTIONS, so this also
        # produces a split littlenavmap-git-debug-*.pkg.tar.zst.
        run: |
          sudo -u builder env SRCDEST="$GITHUB_WORKSPACE/sources" bash -c "
            cd '$GITHUB_WORKSPACE' &&
            makepkg -s --needed --noconfirm
          "

      - name: Show resulting package files
        # Expect BOTH littlenavmap-git-*.pkg.tar.zst (main package)
        # and littlenavmap-git-debug-*.pkg.tar.zst (split debug symbols).
        run: ls -lh *.pkg.tar.*

      - name: Upload main package artifact
        uses: actions/upload-artifact@v7
        with:
          name: littlenavmap-git-x86_64
          path: |
            littlenavmap-git-*.pkg.tar.zst
            littlenavmap-git-*.pkg.tar.xz
            !littlenavmap-git-debug-*
          if-no-files-found: error

      - name: Upload debug package artifact
        uses: actions/upload-artifact@v7
        with:
          name: littlenavmap-git-debug-x86_64
          path: |
            littlenavmap-git-debug-*.pkg.tar.zst
            littlenavmap-git-debug-*.pkg.tar.xz
          if-no-files-found: error
