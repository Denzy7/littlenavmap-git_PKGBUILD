name: Build littlenavmap-git (x86_64)

on:
  push:
    paths:
      - "PKGBUILD"
      - "*.patch"
      - "LittleNavmap.desktop"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "PKGBUILD"
      - "*.patch"
      - "LittleNavmap.desktop"
      - ".github/workflows/build.yml"
  workflow_dispatch:
  schedule:
    # Rebuild weekly to track the -git upstream
    - cron: "0 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Arch Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      # publish the packages as release assets
      contents: write
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update system and install build tooling
        # Package dependencies are deliberately NOT installed here:
        # `makepkg -s` installs them, which also verifies the PKGBUILD's
        # depends/makedepends are complete.
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git sudo ccache
          # Enable makepkg's ccache support (puts /usr/lib/ccache/bin first
          # in PATH, which qmake and cmake both pick up)
          sed -i 's/^BUILDENV=(\(.*\)!ccache/BUILDENV=(\1ccache/' /etc/makepkg.conf
          grep '^BUILDENV=' /etc/makepkg.conf

      - name: Install prebuilt static Qt
        # littlenavmap-qt6-base-static is only needed to build the X-Plane
        # plugin and takes a while to build, so install the package its CI
        # publishes as a release. makepkg -s then sees the dependency as met.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pacman -S --needed --noconfirm github-cli
          gh release download -R Denzy7/littlenavmap-qt6-base-static_PKGBUILD -p '*.pkg.tar.zst' -D /tmp/qt6static
          pacman -U --noconfirm /tmp/qt6static/*.pkg.tar.zst

      - name: Restore source/compiler cache
        uses: actions/cache@v6
        with:
          # sources: makepkg SRCDEST (bare git mirrors, incremental fetches)
          # .ccache: compiler cache. It is keyed on file contents, so unlike
          #          caching the build tree it survives the fresh checkout
          #          makepkg does on every run (new mtimes everywhere).
          path: |
            sources
            .ccache
          # Always save a new cache and restore the newest one; ccache itself
          # decides what is reusable, GitHub evicts old entries.
          key: littlenavmap-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            littlenavmap-v3-

      - name: Create unprivileged build user
        run: |
          # makepkg refuses to run as root, so create a dedicated user
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p "$GITHUB_WORKSPACE/sources" "$GITHUB_WORKSPACE/.ccache"
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package with makepkg
        # -s: install missing deps via pacman, --needed: skip installed deps,
        # --noconfirm: no prompts.
        # The image's makepkg.conf has `debug` in OPTIONS, so this also
        # produces a split littlenavmap-git-debug-*.pkg.tar.zst.
        env:
          SRCDEST: ${{ github.workspace }}/sources
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 3G
          # srcdir path is identical every run, but be safe about it
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          sudo -u builder --preserve-env=SRCDEST,CCACHE_DIR,CCACHE_MAXSIZE,CCACHE_BASEDIR bash -c '
            ccache -z &&
            makepkg -s --needed --noconfirm &&
            ccache -s
          '

      - name: Locate package files
        id: pkgs
        # Expect BOTH littlenavmap-git-*.pkg.tar.zst (main package)
        # and littlenavmap-git-debug-*.pkg.tar.zst (split debug symbols).
        run: |
          set -euo pipefail
          ls -lh *.pkg.tar.*
          main=$(ls littlenavmap-git-[0-9]*.pkg.tar.zst)
          debug=$(ls littlenavmap-git-debug-*.pkg.tar.zst)
          ver=${main#littlenavmap-git-}
          ver=${ver%-x86_64.pkg.tar.zst}
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "debug=$debug" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Check X-Plane plugin only needs glibc
        # lin.xpl is loaded into X-Plane next to other plugins, so like
        # upstream's builds it must carry its own Qt and libstdc++
        env:
          PKG: ${{ steps.pkgs.outputs.main }}
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          bsdtar -xf "$PKG" -C "$tmp" "usr/lib/littlenavmap/Little Navmap/Little Xpconnect"
          xpl="$tmp/usr/lib/littlenavmap/Little Navmap/Little Xpconnect/64/lin.xpl"
          readelf -d "$xpl" | grep NEEDED
          extra=$(readelf -d "$xpl" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p' |
            grep -vxE 'libc\.so\.6|libm\.so\.6|libgcc_s\.so\.1|ld-linux-x86-64\.so\.2' || true)
          if [[ -n $extra ]]; then
            echo "::error::lin.xpl needs unexpected libraries: $(echo $extra)"
            exit 1
          fi

      # archive: false uploads the .pkg.tar.zst itself instead of wrapping it
      # in a zip, so the download is directly installable with `pacman -U`.
      # It takes exactly one file; the artifact is named after the file.
      - name: Upload main package artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pkgs.outputs.main }}
          archive: false
          if-no-files-found: error

      - name: Upload debug package artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pkgs.outputs.debug }}
          archive: false
          if-no-files-found: error

      - name: Publish packages as release
        # Artifacts expire and need a GitHub login to download; a release is
        # permanent and public. Pushes, the weekly rebuild and manual runs on
        # the default branch publish, pull requests never do.
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ steps.pkgs.outputs.main }}
          DEBUG_PKG: ${{ steps.pkgs.outputs.debug }}
          TAG: ${{ steps.pkgs.outputs.tag }}
        run: |
          set -euo pipefail
          notes="Prebuilt littlenavmap-git. Install with \`sudo pacman -U $PKG\`.

          sha256: \`$(sha256sum "$PKG" | cut -d' ' -f1)\`"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # same upstream commit and pkgrel rebuilt (weekly run with no
            # upstream changes, CI change): replace the assets
            gh release upload "$TAG" "$PKG" "$DEBUG_PKG" --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes "$notes" -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$PKG" "$DEBUG_PKG" --latest --title "$TAG" \
              --notes "$notes" --target "$GITHUB_SHA" -R "$GITHUB_REPOSITORY"
          fi

      - name: Keep only the last 3 releases
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkgs.outputs.tag }}
        run: |
          set -euo pipefail
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            -q 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
            while read -r old; do
              [[ $old == "$TAG" ]] && continue
              echo "deleting $old"
              gh release delete "$old" --cleanup-tag --yes -R "$GITHUB_REPOSITORY"
            done
