name: Build littlenavmap-git (x86_64)

on:
  push:
    paths:
      - "PKGBUILD"
      - "*.patch"
      - "LittleNavmap.desktop"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "PKGBUILD"
      - "*.patch"
      - "LittleNavmap.desktop"
      - ".github/workflows/build.yml"
  workflow_dispatch:
  schedule:
    # Rebuild weekly to track the -git upstream
    - cron: "0 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on Arch Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update system and install build tooling
        # Package dependencies are deliberately NOT installed here:
        # `makepkg -s` installs them, which also verifies the PKGBUILD's
        # depends/makedepends are complete.
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm git sudo ccache
          # Enable makepkg's ccache support (puts /usr/lib/ccache/bin first
          # in PATH, which qmake and cmake both pick up)
          sed -i 's/^BUILDENV=(\(.*\)!ccache/BUILDENV=(\1ccache/' /etc/makepkg.conf
          grep '^BUILDENV=' /etc/makepkg.conf

      - name: Restore source/compiler cache
        uses: actions/cache@v6
        with:
          # sources: makepkg SRCDEST (bare git mirrors, incremental fetches)
          # .ccache: compiler cache. It is keyed on file contents, so unlike
          #          caching the build tree it survives the fresh checkout
          #          makepkg does on every run (new mtimes everywhere).
          path: |
            sources
            .ccache
          # Always save a new cache and restore the newest one; ccache itself
          # decides what is reusable, GitHub evicts old entries.
          key: littlenavmap-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            littlenavmap-v3-

      - name: Create unprivileged build user
        run: |
          # makepkg refuses to run as root, so create a dedicated user
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p "$GITHUB_WORKSPACE/sources" "$GITHUB_WORKSPACE/.ccache"
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package with makepkg
        # -s: install missing deps via pacman, --needed: skip installed deps,
        # --noconfirm: no prompts.
        # The image's makepkg.conf has `debug` in OPTIONS, so this also
        # produces a split littlenavmap-git-debug-*.pkg.tar.zst.
        env:
          SRCDEST: ${{ github.workspace }}/sources
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 3G
          # srcdir path is identical every run, but be safe about it
          CCACHE_BASEDIR: ${{ github.workspace }}
        run: |
          sudo -u builder --preserve-env=SRCDEST,CCACHE_DIR,CCACHE_MAXSIZE,CCACHE_BASEDIR bash -c '
            ccache -z &&
            makepkg -s --needed --noconfirm &&
            ccache -s
          '

      - name: Locate package files
        id: pkgs
        # Expect BOTH littlenavmap-git-*.pkg.tar.zst (main package)
        # and littlenavmap-git-debug-*.pkg.tar.zst (split debug symbols).
        run: |
          set -euo pipefail
          ls -lh *.pkg.tar.*
          main=$(ls littlenavmap-git-[0-9]*.pkg.tar.zst)
          debug=$(ls littlenavmap-git-debug-*.pkg.tar.zst)
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "debug=$debug" >> "$GITHUB_OUTPUT"

      # archive: false uploads the .pkg.tar.zst itself instead of wrapping it
      # in a zip, so the download is directly installable with `pacman -U`.
      # It takes exactly one file; the artifact is named after the file.
      - name: Upload main package artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pkgs.outputs.main }}
          archive: false
          if-no-files-found: error

      - name: Upload debug package artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pkgs.outputs.debug }}
          archive: false
          if-no-files-found: error
