name: Build littlenavmap-git (x86_64)

on:
  push:
    paths:
      - "PKGBUILD"
      - "*.patch"
      - "LittleNavmap.desktop"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:
  schedule:
    # Optional: rebuild weekly to track the -git upstream
    - cron: "0 3 * * 0"

jobs:
  build:
    name: Build on Arch Linux (x86_64)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      # --privileged: systemd-nspawn (used internally by pkgctl build to
      # build inside the clean chroot) needs CAP_SYS_ADMIN and friends to
      # create its own mount/user namespaces. Mounting the host's cgroup
      # tree in read-write is also required for nspawn to manage the
      # container's cgroup.
      options: --privileged
      volumes:
        - /sys/fs/cgroup:/sys/fs/cgroup:rw

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install devtools
        # pkgctl (from devtools) resolves and installs this package's
        # depends/makedepends INSIDE the chroot itself, straight from the
        # PKGBUILD -- so nothing package-specific (qt6-*, cmake, curl, ...)
        # needs to be installed on the host at all.
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm devtools sudo

      - name: Resolve upstream commit hashes
        id: srcrefs
        run: |
          set -e

          # Query the latest commit on each upstream repo WITHOUT cloning.
          # These four hashes together uniquely identify "the source state"
          # this build would produce, so they drive the cache key below.
          # `head -n1` guards against ls-remote matching more than one ref
          # (e.g. HEAD plus a same-named branch) and returning multiple lines.
          get_sha() {
            git ls-remote "$1" "$2" | head -n1 | cut -f1
          }

          atools_sha=$(get_sha https://github.com/albar965/atools.git HEAD)
          marble_sha=$(get_sha https://github.com/albar965/marble.git refs/heads/lnm/1.2)
          littlenavconnect_sha=$(get_sha https://github.com/albar965/littlenavconnect.git HEAD)
          littlenavmap_sha=$(get_sha https://github.com/albar965/littlenavmap.git HEAD)

          # Sanity check: each value must be exactly one 40-char hex SHA.
          for pair in "atools:$atools_sha" "marble:$marble_sha" \
                      "littlenavconnect:$littlenavconnect_sha" \
                      "littlenavmap:$littlenavmap_sha"; do
            name=${pair%%:*}
            sha=${pair#*:}
            if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
              echo "::error::Could not resolve a single commit SHA for $name (got: '$sha')"
              exit 1
            fi
          done

          echo "atools=$atools_sha" >> "$GITHUB_OUTPUT"
          echo "marble=$marble_sha" >> "$GITHUB_OUTPUT"
          echo "littlenavconnect=$littlenavconnect_sha" >> "$GITHUB_OUTPUT"
          echo "littlenavmap=$littlenavmap_sha" >> "$GITHUB_OUTPUT"
          echo "combined=${atools_sha}-${marble_sha}-${littlenavconnect_sha}-${littlenavmap_sha}" >> "$GITHUB_OUTPUT"

      - name: Restore source/build cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            src
            pkg
          # Exact hit only when NOTHING upstream has changed since the cache
          # was written -> safe to reuse untouched.
          key: littlenavmap-src-${{ steps.srcrefs.outputs.combined }}
          # Fallback: an older cache (some repos changed). We still restore
          # it so `git pull` inside prepare() only has to fetch the delta
          # for the repos that moved, instead of a full re-clone, and `make`
          # only has to recompile what actually changed.
          restore-keys: |
            littlenavmap-src-

      - name: Create unprivileged build user
        run: |
          # pkgctl build (like makepkg/makechrootpkg) refuses to run as
          # root, so we need a dedicated user with passwordless sudo --
          # it shells out to sudo internally for the privileged parts
          # (creating/updating the chroot, invoking systemd-nspawn, etc.).
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package in clean chroot (main + debug)
        # pkgctl build creates/updates the base chroot under
        # /var/lib/archbuild/ itself (first run only; later runs reuse and
        # just update it) -- no manual mkarchroot step needed.
        #
        # --repo extra:  this package isn't in an official repo, so tell
        #                 pkgctl which chroot flavor to use rather than
        #                 relying on auto-detection (which only works for
        #                 packages already released in a repo).
        # --arch x86_64:  build explicitly for x86_64.
        # -c/--clean:     recreate the chroot's working copy before
        #                 building, so every run starts from a pristine
        #                 state rather than whatever a previous run left
        #                 behind.
        #
        # Package depends/makedepends are installed inside the chroot
        # automatically from the PKGBUILD -- nothing manual here. Because
        # the system default makepkg.conf has `debug` in OPTIONS, this
        # also produces a split littlenavmap-git-debug-*.pkg.tar.zst
        # alongside the main package.
        run: |
          sudo -u builder bash -c "
            cd '$GITHUB_WORKSPACE' &&
            pkgctl build --repo extra --arch x86_64 -c
          "

      - name: Show resulting package files
        # Expect to see BOTH littlenavmap-git-*.pkg.tar.zst (main package)
        # and littlenavmap-git-debug-*.pkg.tar.zst (split debug symbols).
        run: ls -lh *.pkg.tar.*

      - name: Upload main package artifact
        uses: actions/upload-artifact@v4
        with:
          name: littlenavmap-git-x86_64
          path: |
            littlenavmap-git-*.pkg.tar.zst
            littlenavmap-git-*.pkg.tar.xz
            !littlenavmap-git-debug-*
          if-no-files-found: error

      - name: Upload debug package artifact
        uses: actions/upload-artifact@v4
        with:
          name: littlenavmap-git-debug-x86_64
          path: |
            littlenavmap-git-debug-*.pkg.tar.zst
            littlenavmap-git-debug-*.pkg.tar.xz
          if-no-files-found: error
